<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal dos Trabalhadores</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --azul:#003366;
    --azul-claro:#1E88E5;
    --cinza:#f5f7fa;
    --branco:#ffffff;
}

body{
    font-family:'Segoe UI',Arial,sans-serif;
    background:var(--cinza);
    color:#333;
}

header{
    background:var(--azul);
    color:white;
    padding:20px 8%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    font-size:1.6rem;
    font-weight:bold;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:20px;
    font-weight:500;
}

nav a:hover{
    color:#90CAF9;
}

.hero{
    min-height:75vh;
    background:linear-gradient(
        rgba(0,51,102,.82),
        rgba(0,51,102,.82)
    ),
    url("https://images.unsplash.com/photo-1517048676732-d65bc937f952?q=80&w=1600");
    background-size:cover;
    background-position:center;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:white;
    padding:40px;
}

.hero-content{
    max-width:900px;
}

.hero h1{
    font-size:3.5rem;
    margin-bottom:20px;
}

.hero p{
    font-size:1.2rem;
    margin-bottom:30px;
}

.btn{
    display:inline-block;
    background:var(--azul-claro);
    color:white;
    padding:15px 30px;
    text-decoration:none;
    border-radius:8px;
    font-weight:bold;
    transition:.3s;
}

.btn:hover{
    transform:translateY(-2px);
    background:#1565C0;
}

.section{
    padding:80px 8%;
}

.section h2{
    text-align:center;
    color:var(--azul);
    margin-bottom:40px;
    font-size:2rem;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:25px;
}

.card{
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,.08);
    transition:.3s;
}

.card:hover{
    transform:translateY(-6px);
}

.card h3{
    margin-bottom:15px;
    color:var(--azul);
}

.news{
    max-width:1000px;
    margin:auto;
}

.news-item{
    background:white;
    padding:25px;
    border-radius:15px;
    margin-bottom:20px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.highlight{
    background:var(--azul);
    color:white;
}

.
