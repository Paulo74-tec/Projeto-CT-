<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal dos Trabalhadores</title>

<style>
body{
    margin:0;
    font-family:Segoe UI,Arial,sans-serif;
    background:#f5f7fa;
}

header{
    background:#003366;
    color:white;
    padding:20px;
    text-align:center;
}

..hero{
    min-height:70vh;
    background:
    linear-gradient(
        rgba(0,51,102,0.65),
        rgba(0,51,102,0.65)
    ),
    url('Designer.png');

    background-size:cover;
    background-position:center;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:white;
}

.hero h1{
    font-size:48px;
}

.cards{
    display:flex;
    gap:20px;
    justify-content:center;
    padding:40px;
    flex-wrap:wrap;
}

.card{
    background:white;
    width:280px;
    padding:20px;
    border-radius:12px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

footer{
    background:#003366;
    color:white;
    text-align:center;
    padding:20px;
}
</style>
</head>

<body>

<header>
<h2>🏺 Projeto CT</h2>
</header>

<section class="hero">
<h1>Portal dos Trabalhadores</h1>
<p>Informação • Transparência • Participação</p>
</section>

<div class="cards">

<div class="card">
<h3>📢 Comunicados</h3>
<p>Últimas informações e avisos.</p>
</div>

<div class="card">
<h3>📄 Documentos</h3>
<p>Atas, regulamentos e documentação.</p>
</div>

<div class="card">
<h3>📅 Agenda</h3>
<p>Reuniões e eventos futuros.</p>
</div>

</div>

<footer>
© 2026 Projeto CT
</footer>

</body>
</html>
